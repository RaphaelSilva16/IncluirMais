<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="Ilustração de uma agenda visual em tons escuros com detalhes dourados." >
  <defs>
    <linearGradient id="heroBgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171b" />
      <stop offset="0.55" stop-color="#101013" />
      <stop offset="1" stop-color="#1c1c21" />
    </linearGradient>
    <linearGradient id="heroGoldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c45f" />
      <stop offset="1" stop-color="#c2820a" />
    </linearGradient>
    <linearGradient id="heroPanelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232326" />
      <stop offset="1" stop-color="#1a1a1e" />
    </linearGradient>
    <filter id="heroShadowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <filter id="softShadowDark" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="720" height="720" rx="56" fill="url(#heroBgDark)" />

  <circle cx="548" cy="196" r="238" fill="#222226" opacity="0.9" />
  <circle cx="548" cy="196" r="238" fill="none" stroke="#39393d" stroke-width="1.5" />
  <circle cx="548" cy="196" r="168" fill="none" stroke="#39393d" stroke-width="1.5" opacity="0.7" />
  <circle cx="142" cy="588" r="128" fill="#282219" />
  <circle cx="620" cy="602" r="72" fill="#222226" />

  <circle cx="120" cy="168" r="12" fill="url(#heroGoldDark)" filter="url(#softShadowDark)" />
  <circle cx="180" cy="118" r="7" fill="url(#heroGoldDark)" />
  <circle cx="646" cy="410" r="9" fill="url(#heroGoldDark)" filter="url(#softShadowDark)" />

  <g transform="rotate(-3 360 360)">
    <rect x="196" y="126" width="342" height="470" rx="34" fill="url(#heroPanelDark)" filter="url(#heroShadowDark)" />
    <rect x="196" y="126" width="342" height="470" rx="34" fill="none" stroke="#3a3a3f" stroke-width="1.5" />

    <rect x="228" y="162" width="66" height="12" rx="6" fill="url(#heroGoldDark)" opacity="0.95" />
    <rect x="228" y="188" width="180" height="16" rx="8" fill="#a1a1aa" />
    <rect x="228" y="214" width="124" height="10" rx="5" fill="#606067" />
    <line x1="228" y1="252" x2="506" y2="252" stroke="#39393d" stroke-width="1.5" />

    <g>
      <circle cx="266" cy="308" r="17" fill="url(#heroGoldDark)" />
      <rect x="300" y="294" width="150" height="13" rx="6.5" fill="#a1a1aa" />
      <rect x="300" y="314" width="104" height="10" rx="5" fill="#626269" />
      <rect x="257" y="325" width="18" height="58" rx="9" fill="#333338" />
    </g>
    <g>
      <circle cx="266" cy="392" r="17" fill="#7a7a7a" />
      <rect x="300" y="378" width="168" height="13" rx="6.5" fill="#a1a1aa" />
      <rect x="300" y="398" width="92" height="10" rx="5" fill="#626269" />
      <rect x="257" y="409" width="18" height="58" rx="9" fill="#333338" />
    </g>
    <g>
      <circle cx="266" cy="476" r="17" fill="url(#heroGoldDark)" />
      <rect x="300" y="462" width="132" height="13" rx="6.5" fill="#a1a1aa" />
      <rect x="300" y="482" width="118" height="10" rx="5" fill="#626269" />
      <rect x="257" y="493" width="18" height="58" rx="9" fill="#333338" />
    </g>
    <g>
      <circle cx="266" cy="560" r="17" fill="#7a7a7a" opacity="0.8" />
      <rect x="300" y="546" width="150" height="13" rx="6.5" fill="#a1a1aa" opacity="0.8" />
      <rect x="300" y="566" width="80" height="10" rx="5" fill="#626269" />
    </g>
