  <g filter="url(#softShadowDark)">
    <circle cx="556" cy="544" r="46" fill="url(#heroGoldDark)" />
    <path d="M536 546 l14 14 l26 -30" fill="none" stroke="#09090b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#softShadowDark)">
    <rect x="118" y="332" width="76" height="76" rx="24" fill="#232326" />
    <rect x="118" y="332" width="76" height="76" rx="24" fill="none" stroke="#3a3a3f" stroke-width="1.5" />
    <path d="M156 352 v36 M138 370 h36" stroke="#e3af35" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
